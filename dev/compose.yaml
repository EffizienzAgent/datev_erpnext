name: frappe-datev-erpnext

services:
  db:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: "123"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:8-alpine

  redis-queue:
    image: redis:8-alpine

  bench:
    image: frappe/bench:v5.31.0
    command: sleep infinity
    working_dir: /home/frappe/bench-data
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    ports:
      - "8011:8000"
    volumes:
      - ..:/workspace/frappe-datev-erpnext
      - ${DATEV_CORE_PATH:-../../frappe-datev}:/workspace/frappe-datev
      - bench-data:/home/frappe/bench-data

volumes:
  db-data:
  bench-data:
